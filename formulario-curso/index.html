<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voto en el Curso</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Formulario de Votación</h1>
        <p>Completá los datos para indicar cual es tu parte favorita del curso.</p>
    </header>

    <main>

        <form>

            <fieldset>
                <legend>Datos personales</legend>

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresá tu nombre" required>

                <br><br>

                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" placeholder="Ingresá tu apellido" required>
            </fieldset>

            <br>

            <fieldset>
                <legend>Datos del curso</legend>

                <label for="curso">Curso:</label>

                <select id="curso" name="curso" required>
                    <option value="">Seleccioná un curso</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="Java Script">CSS</option>
                    <option value="Boostrap">CSS</option>
                </select>
            </fieldset>

            <br>

            <button type="submit">Enviar Voto</button>
            <button type="reset">Limpiar</button>

        </form>

        <br>

        <a href="main.html">Volver al inicio</a>

    </main>

    <footer>
        <p>Curso de Desarrollo Web</p>
    </footer>

</body>

</html>
