<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style2.css">
    <title>Formulario curso</title>
</head>
<body>
    <header>
        <h1>
            Formulario de inscripcion a un curso
        </h1>
        <p>
            Complete los datos para inscribirse en el curso.
        </p>
    </header>

    <main>
        <form action="POST">
            <fieldset>
                <legend>
                    Datos Personales
                </legend>
                <label for="nombre">Nombre: </label>
                <input id="nombre" name="nombre" type="text" placeholder="Ingrese su nombre">

                <br><br>

                <label for="apellido">Apellido:</label>
                <input id="apellido" name="apellido" type="text" placeholder="Ingrese su apellido">

                <br><br>

                <label for="nro_doc">Numero de documento:</label>
                <input type="number" id="nro_doc" name="nro_doc" placeholder="Ingrese su numero de documento">

                <br><br>

                <label for="fecha_nacimiento">
                    Fecha de nacimiento:
                </label>
                <input type="date" name="fecha_nacimiento" id="fecha_nacimiento">

                <br><br>

                <label for="correo_electronico">
                    Correo electronico: 
                </label>
                <input type="email" name="correo_electronico" id="correo_electronico">

                <br><br>

                <label for="nro_telefono">
                    Numero de telefono:
                </label>
                <input type="tel" id="nro_telefono" name="nro_telefono">

                <br><br>

                <label for="">
                    Genero:
                </label>

                <br><br>

                <label>
                    <input type="radio" name="genero" value="mas"> Masculino
                </label>

                <label>
                    <input type="radio" name="genero" value="fem">
                    Femenino
                </label>

                <label>
                    <input type="radio" name="genero" value="otr">
                    Otro
                </label>

                <br><br>
                <label >
                    Pais de residencia
                    <input type="text" name="pais">
                </label>


            </fieldset>

            <fieldset>
                <legend>
                    Datos del curso
                </legend>
                <label>
                    Curso a inscribirse <input type="text">
                </label>
                <br><br>

                <label>
                    Modalidad
                    <select name="modalidad" id="modalidad">
                        <option value="presencial">presencial</option>
                        <option value="virtual">virtual</option>
                        <option value="hibrido">hibrido</option>
                    </select>
                </label>
                <br><br>
                <label>
                    Turno
                    <select name="turno" id="turno">
                        <option value="manhana">mañana</option>
                        <option value="tarde">tarde</option>
                        <option value="noche">noche</option>
                    </select>
                </label>
                <br><br>
                <label>
                    Fecha de inicio
                    <input type="date">
                </label>
                <br><br>
                <label>
                    Horas aproximadas en el curso
                    <input type="time">
                </label>
            </fieldset>

            <fieldset>
                <legend>
                    Conocimientos previos
                </legend>
                <label >
                        seleccione uno o varios conocimientos
                    <label>
                        <br><br>
                        <input type="checkbox" name="conocimiento" id="1">
                        html
                    </label>
                    <br><br>
                    <label>
                        <input type="checkbox" name="conocimiento" id="2">
                        css
                    </label>
                    <br><br>
                    <label>
                        <input type="checkbox" name="conocimiento" id="1">
                        javascript
                    </label>
                    <br><br>
                    <label>
                        <input type="checkbox" name="conocimiento" id="1">
                        programacion
                    </label>
                    <br><br>
                    <label>
                        <input type="checkbox" name="conocimiento" id="1">
                        base de datos
                    </label>
                    <br><br>
                    <label>
                        <input type="checkbox" name="conocimiento" id="1">
                        ninguno
                    </label>
                    <br><br>
                </label>
            </fieldset>

            <fieldset>
                <legend>
                    Nivel de experiencia
                </legend>
                <label>
                    Años de experencia
                    <input type="number" min="0" max="40">
                </label>
                <br><br>

                <label>
                    nivel de conocimiento informatico
                    <input type="number" min="1" max="10">
                </label>
                <br><br>

            </fieldset>

            <fieldset>
                <legend>
                    Informacion Adicional
                </legend>
                <label>
                    Profesion u ocupacion
                    <input type="text">
                </label>
                <br><br>

                <label>
                    Empresa donde trabaja
                    <input type="text">
                </label>
                <br><br>

                <label>
                    pagina web personal
                    <input type="text">
                </label>
                <br><br>

                <label>
                    Porque desea realizar el curso?
                    <textarea name="porque" id="porque">

                    </textarea>
                </label>
                <br><br>

                <label>
                    Adjunte su curricuum
                    <input type="file">
                </label>
                <br><br>
            </fieldset>

            <fieldset>
                <legend>
                    Preferencias de comunicacion
                </legend>
                        <label >
                        seleccione uno o varios conocimientos
                    <label>
                        <br><br>
                        <input type="checkbox" name="comu" id="1">
                        Correo electronico
                    </label>
                    <br><br>

                    <label>
                        <input type="checkbox" name="comu" id="2">
                        Whatsapp
                    </label>
                    <br><br>

                    <label>
                        <input type="checkbox" name="comu" id="1">
                        Llamada
                    </label>
                    <br><br>


                </label>
                <br><br>

                <label >
                    <input type="checkbox" name="comu" id="1">
                        Quiere recibir mas info
                </label>
            </fieldset>
        </form>
    </main>
    
</body>
</html>
