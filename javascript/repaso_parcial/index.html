<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Juego de adivinanza</title>
</head>
<style>
    body {
        height: 100vh;
    }
</style>
<body class="container py-4 d-flex flex-column justify-content-center align-items-center">
    <div class="container shadow-lg mt-4 p-4" style="max-width: 500px; border-radius: 10px; background-color: white;" >
        <h2 class="text-center mb-4">Adivina el numero(1-100)</h2>
        <div class="mb-4">
            <label for="numero" class="form-label">Ingrese el numero:</label>
            <input class="form-control" type="number" name="numero" id="numeroIngresado" min="1" minlength="1" max="100" maxlength="100">
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary w-50" id="btnProbar" onclick="jugar()">
                Probar
            </button>
            <button class="btn btn-danger w-50" id="btnReiniciar" onclick="iniciarJuego()">
                Reiniciar
            </button>
        </div>
        <hr>
        <p class="mb-2">
            <strong>Intentos restantes: </strong> <span id="intentosRestantes"></span>
        </p>
        <div id="alerta" class="alert d-none mt-3" role="alert"></div>

        <div class="mt-3">
            <h6>Historial de intentos: </h6>
            <ul id="historialIntentos" class="list-group-flush"></ul>
        </div>

    </div>

    <script src="main.js"></script>
</body>
</html>
