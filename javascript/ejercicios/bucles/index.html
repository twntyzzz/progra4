<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Ejercicios de Bucles</title>
</head>
<body class="container py-4">
    <div class="container p-3 mt-4 shadow-lg" style="max-width: 600px; border-radius: 10px; background-color: white;">
        <h1 class="text-center mb-3">Numeros del 1 al 10</h1>
        <div class="container shadow p-2" style="background-color: lavender; border-radius: 10px; ">
            <ul id="lista" class="list-group list-group-flesh"></ul>
        </div>
        <button class="btn btn-success w-100 mt-3" id="imprimirNumeros">Imprimir</button>
    </div>

    <div class="container p-3 mt-4 shadow-lg" style="max-width: 600px; border-radius: 10px; background-color: white;">
        <h1 class="text-center mb-3">Numeros pares del 1 al 20</h1>
        <div class="container shadow p-2" style="background-color: lavender; border-radius: 10px; ">
            <ul id="lista-pares" class="list-group list-group-flesh"></ul>
        </div>
        <button class="btn btn-success w-100 mt-3" id="imprimirNumerosPares">Imprimir</button>
    </div>

    <script src="main.js"></script>
</body>
</html>
