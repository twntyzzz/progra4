<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Variables y Tipos de Datos</title>
</head>
<body class="container py-4">
    <div class="container mt-4 p-3 shadow-lg" style="max-width: 500px; border-radius: 10px">
        <h2 class="text-center mb-3">Complete los siguientes campos</h2>
        <div class="mb-4">
            <label for="nombre" class="form-label">Nombre: </label>
            <input type="text" id="nombre" class="form-control" required>
        </div>
        <div class="mb-4">
            <label for="edad" class="form-label">Edad:</label>
            <input type="number" id="edad" class="form-control" min="1" max="99" minlength="0" maxlength="99" required> 
        </div>
        <div class="mb-4">
            <label for="ciudad" class="form-label">Ciudad: </label>
            <input type="text" id="ciudad" class="form-control" required>
        </div>
        <button class="btn btn-success mt-3 w-100" id="botonCalcular">
            Calcular días vividos
        </button>
    </div>

    <div class="container mt-4 p-3 shadow-lg" style="max-width: 500px; border-radius: 10px;">
        <h3 class="text-center" id="resultado"></h3>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
