<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>operadores y condicionales</title>
</head>
<body class="container py-4">
    <div class="container p-3 mt-3 shadow-lg" style="max-width: 400px; border-radius: 10px; background-color: whitesmoke;">
        <h2 class="text-center mb-3">Calculadora</h2>
        <div class="mb-4">
            <label for="numero1" class="form-label">Numero 1:</label>
            <input type="number" name="numero1" id="numero1" class="form-control">
        </div>
        <div class="mb-4">
            <label for="numero2" class="form-label">Numero 2:</label>
            <input type="number" name="numero2" id="numero2" class="form-control">
        </div>
        <div class="mb-4">
            <div class="form-group">
                <label for="operacion" class="form-label">Elige la operación</label>
                <select class="form-select" name="operacion" id="operacion">
                    <option value="suma">+</option>
                    <option value="resta">-</option>
                    <option value="multiplicacion">*</option>
                    <option value="division">/</option>
                </select>
            </div>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-success w-50" onclick="calcular()">
                Calcular
            </button>
            <button class="btn btn-danger w-50" onclick="limpiar()">
                Limpiar
            </button>
        </div>
    </div>

    <div class="container p-3 mt-3 shadow-lg" style="max-width: 400px; border-radius: 10px; background-color: whitesmoke;">
        <h4>Resultado:</h4>
        <p class="text-center" id="resultado"></p>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>
</html>
