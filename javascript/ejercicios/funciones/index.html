<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Sumar</title>
</head>
<body class="container py-4">
    <div class="container p-3 shadow-lg mt-4" style="max-width: 600px; border-radius: 10px; background-color: white;">
        <h1 class="text-center mb-2">Sumar 2 numeros</h1>
        <div class="mb-4">
            <label for="num1" class="form-label">Numero 1:</label>
            <input type="number" id="num1" class="form-control">
        </div>
        <div class="mb-4">
            <label for="num2" class="form-label">Numero 2:</label>
            <input type="number" id="num2" class="form-control">
        </div>
        <div class="mb-4 d-flex gap-2">
            <p class="text-center">Resultado: </p>
            <p id="resultado"></p>
        </div>
        <button class="btn btn-success w-100" onclick=sumar()>
            Calcular
        </button>
    </div>

    <div class="container p-3 shadow-lg mt-4" style="max-width: 600px; border-radius: 10px; background-color: white;">
        <h1 class="text-center mb-2">
            Inserte la edad de la persona
        </h1>
        <div class="mb-4">
            <label for="edad" class="form-label">edad:</label>
            <input type="number" id="edad" class="form-control">
        </div>
        <div class="d-flex gap-2">
            <p id="esMayor"></p>
        </div>
        <button class="btn btn-success w-100" onclick=ejecutar()>
            Calcular
        </button>
    </div>

    <script src="main.js"></script>
</body>
</html>
