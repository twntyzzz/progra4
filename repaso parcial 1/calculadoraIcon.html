<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi calculadora</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

  <main class="container mt-5">

    <h1 class="text-center mb-4">
       <i class="bi bi-calculator"> Mi calculadora</i>      
    </h1>

    <section class="col-md-4 mx-auto">

      <label for="num1">
        <i class="bi bi-1-circle"></i>
        Primer número
      </label>

      <input
        type="number"
        class="form-control mb-3"
        id="num1"
        placeholder="Ingrese el primer número"
      >


      <label for="num2">
        <i class="bi bi-2-circle"></i>
        Segundo número
      </label>

      <input
        type="number"
        class="form-control mb-3"
        id="num2"
        placeholder="Ingrese el segundo número"
      >


      <label for="operacion">
        <i class="bi bi-list"></i>
        Operación
      </label>

      <select
        class="form-control mb-3"
        id="operacion"
      >
        <option value="sum">Suma</option>
        <option value="resta">Resta</option>
        <option value="multiplicacion">Multiplicación</option>
        <option value="division">División</option>
      </select>


      <button class="btn btn-primary btn-block mb-2" onclick="calcular()">
        <i class="bi bi-calculator-fill"></i>
        Calcular
      </button>


      <button class="btn btn-danger btn-block" onclick="limpiar()">
        <i class="bi bi-trash"></i>
        Limpiar
      </button>


      <p class="alert alert-info mt-3">
        <i class="bi bi-info-circle"></i>
        Resultado:
        <span id="resultado"></span>
      </p>

    </section>

  </main>


  <!-- JavaScript -->
  <script src="js/calcular.js"></script>

</body>
</html>
