<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el número secreto</title>

    <!-- Bootstrap 5 CSS: Hoja de estilos para el diseño y componentes (botones, alertas, etc.) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Bootstrap Icons: Librería para poder usar íconos con clases como 'bi bi-...' -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Font Awesome: Para el icono de calavera / esqueleto -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Estilos personalizados propios -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="container py-4">

    <!-- Contenedor principal con estilo de tarjeta centrado -->
    <div class="container p-4 mt-4 shadow" style="max-width: 450px; border-radius: 10px; background-color: whitesmoke;">
        
        <!-- Título principal del juego con un ícono de Bootstrap -->
        <h2 class="text-center mb-3">
            <i class="bi bi-question-circle"></i> Adivina el número secreto
        </h2>

        <!-- Campo donde el usuario escribe el número -->
        <div class="mb-3">
            <label for="numero" class="form-label">
                <i class="bi bi-123"></i> Ingresa un número (1–100):
            </label>
            <!-- id="numero" para que podamos leer su valor desde JavaScript -->
            <input type="number" id="numero" class="form-control" placeholder="Ej: 50">
        </div>

        <!-- Botones de acción: Probar y Reiniciar -->
        <div class="d-flex gap-2 mb-3">
            <!-- onclick="probar()" ejecuta la función probar() en script.js al hacer clic -->
            <button class="btn btn-primary w-50" id="btnProbar" onclick="probar()">
                <i class="bi bi-check-lg"></i> Probar
            </button>
            <!-- onclick="reiniciar()" ejecuta la función reiniciar() en script.js al hacer clic -->
            <button class="btn btn-danger w-50" onclick="reiniciar()">
                <i class="bi bi-arrow-counterclockwise"></i> Reiniciar
            </button>
        </div>

        <hr>

        <!-- Contador de intentos restantes con iconos de corazones y calaveras -->
        <p class="mb-2 d-flex align-items-center justify-content-between">
            <!-- id="intentos" para actualizar los corazones/calaveras en pantalla desde JS -->
            <strong>Intentos restantes:</strong>
            <span id="intentos" class="fs-5"></span>
        </p>

        <!-- Caja de mensajes del juego (alertas de Bootstrap) -->
        <!-- 'd-none' es una clase de Bootstrap que oculta el elemento hasta que tengamos un mensaje para mostrar -->
        <div id="mensaje" class="alert d-none mt-3" role="alert"></div>

        <!-- Historial de intentos anteriores -->
        <div class="mt-3">
            <h6><i class="bi bi-clock-history"></i> Historial de intentos:</h6>
            <!-- id="historial" es la lista (ul) donde JavaScript va agregando cada intento realizado -->
            <ul class="list-group" id="historial">
            </ul>
        </div>

    </div>

    <!-- Bootstrap JS: Permite el funcionamiento de componentes interactivos de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <!-- Nuestro archivo de lógica JavaScript -->
    <script src="script.js"></script>
</body>

</html>
