<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Dados | Repaso Parcial 1</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos específicos para los dados -->
    <link rel="stylesheet" href="dados.css">
</head>

<body class="container py-4">

    <!-- Contenedor principal con diseño de tarjeta centrado -->
    <div class="container p-4 mt-4 shadow" style="max-width: 450px; border-radius: 10px; background-color: whitesmoke;">
        
        <!-- Título principal -->
        <h2 class="text-center mb-4">
            <i class="bi bi-dice-5"></i> Lanzador de Dados
        </h2>

        <!-- Contenedor visual de los dos dados -->
        <div class="d-flex justify-content-center gap-4 mb-4">
            <div id="dado1" class="dado-caja text-danger">
                1
            </div>
            <div id="dado2" class="dado-caja text-primary">
                1
            </div>
        </div>

        <!-- Alerta de estado y total -->
        <div id="total" class="alert alert-info text-center fw-bold fs-5 mb-3">
            Presiona el botón para lanzar
        </div>

        <!-- Botones de acción -->
        <div class="d-flex gap-2 mb-3">
            <button id="boton" class="btn btn-success w-50 fw-bold" onclick="lanzar()">
                <i class="bi bi-play-circle"></i> Lanzar
            </button>
            <button class="btn btn-danger w-50" onclick="reiniciar()">
                <i class="bi bi-arrow-counterclockwise"></i> Reiniciar
            </button>
        </div>

        <hr>

        <!-- Historial de lanzamientos -->
        <div class="mt-3">
            <h6>Historial de lanzamientos:</h6>
            <ul class="list-group" id="historial">
            </ul>
        </div>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <!-- Archivo JavaScript -->
    <script src="dados.js"></script>
</body>

</html>
