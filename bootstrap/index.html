<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Clase bootstrap | Formulario Basico</title>
</head>

<style>
    body, html{
        width: 100%;
        height: 100%;
        margin: 0;
    }
</style>

<body>
    
    <div class="d-flex flex-column justify-content-center align-items-center p-5" style="height: 100%;">
        <div class="container p-4" style="background-color: rgb(0, 0, 63); border-radius: 10px; max-width: 300px; ">
            <form action="POST">
                <div class="text-center mb-4">
                    <h3 style="color:white">Inicio de sesión</h3>
                </div>
                <div class="mb-3">
                    <label for="nombre" class="form-label" style="color: white;">Nombre de usuario:</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ingrese su nombre de usuario">
                </div>
                <div class="mb-4">
                    <label for="nombre" class="form-label" style="color: white;">Contraseña:</label>
                    <input type="password" class="form-control" id="nombre" placeholder="Ingrese su contraseña">
                </div>
                
                <button type="submit" class="btn btn-danger w-100">Ingresar</button>       
            </form>
        </div>
    </div>
</body>

</html>
